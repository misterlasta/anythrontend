[project]
name = "twa-invest-platform"
version = "0.1.0"
description = "Backend for TON investment TWA platform (FastAPI + aiogram 3.x)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiogram>=3.13,<4",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools"]
